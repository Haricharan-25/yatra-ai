server.port=${PORT:8080}

# Nominatim OpenStreetMap configuration
geocoding.nominatim.url=${NOMINATIM_URL:https://nominatim.openstreetmap.org/reverse}
geocoding.nominatim.search-url=${NOMINATIM_SEARCH_URL:https://nominatim.openstreetmap.org/search}
geocoding.nominatim.user-agent=${NOMINATIM_USER_AGENT:YatraAI-TravelCompanion/1.0 (contact@yatraai.local)}
geocoding.nominatim.timeout-ms=${NOMINATIM_TIMEOUT_MS:5000}
geocoding.cache-enabled=${GEOCODING_CACHE_ENABLED:true}

# OpenStreetMap Overpass Places configuration
places.overpass.url=${OVERPASS_URL:https://overpass-api.de/api/interpreter}
places.trigger-distance.major-landmark=${TRIGGER_DIST_MAJOR_LANDMARK:2000.0}
places.trigger-distance.normal-attraction=${TRIGGER_DIST_NORMAL_ATTRACTION:1000.0}
places.trigger-distance.scenic-feature=${TRIGGER_DIST_SCENIC_FEATURE:1500.0}
places.min-importance-threshold=${MIN_IMPORTANCE_THRESHOLD:6}
places.cache-enabled=${PLACES_CACHE_ENABLED:true}

# Routing configuration (OSRM free provider)
routing.osrm.url=${ROUTING_OSRM_URL:https://router.project-osrm.org/route/v1/driving}
routing.lead-distance.major-landmark=${ROUTING_LEAD_DIST_MAJOR:2500.0}
routing.lead-distance.normal-attraction=${ROUTING_LEAD_DIST_NORMAL:1500.0}
routing.corridor-width-meters=${ROUTING_CORRIDOR_WIDTH:2000.0}
routing.cache-enabled=${ROUTING_CACHE_ENABLED:true}

# Weather configuration (Open-Meteo free provider)
weather.openmeteo.url=${WEATHER_URL:https://api.open-meteo.com/v1/forecast}
weather.enabled=${WEATHER_ENABLED:true}
weather.cache-duration-minutes=${WEATHER_CACHE_DURATION_MINUTES:15}

# Journey story engine configuration
journey.story.cooldown-seconds=${JOURNEY_STORY_COOLDOWN_SECONDS:300}

# AI configuration (Configurable provider - defaults to OpenAI compatible API)
ai.api.key=${AI_API_KEY:}
ai.api.url=${AI_API_URL:https://api.openai.com/v1/chat/completions}
ai.model=${AI_MODEL:gpt-4o-mini}
ai.timeout-seconds=${AI_TIMEOUT_SECONDS:15}

# CORS configuration
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Logging
logging.level.com.yatraai=INFO
